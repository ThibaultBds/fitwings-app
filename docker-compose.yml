version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitwings-web
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
      - mongo
      - mailhog
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
      - MONGO_URI=mongodb://mongo:27017
      - MAIL_HOST=mailhog
      - MAIL_PORT=1025
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=fitwings
      - DB_USERNAME=fitwings_user
      - DB_PASSWORD=fitwings_pass
      - DB_CONNECTION=mysql
    restart: always

  db:
    image: mysql:8.4
    container_name: fitwings-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fitwings
      MYSQL_USER: fitwings_user
      MYSQL_PASSWORD: fitwings_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: fitwings-phpmyadmin
    restart: always
    ports:
      - "8083:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db

  mongo:
    image: mongo:7.0
    container_name: fitwings-mongo
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  mailhog:
    image: mailhog/mailhog
    container_name: fitwings-mailhog
    restart: always
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  db_data:
  mongo_data:
